name: build-sglang

on:
  push:
    branches: [main]
    paths:
      - "engines/sglang/**"
      - ".github/workflows/build-sglang.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      push:
        description: "Push to ghcr.io"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        run: |
          set -eu
          Y=engines/sglang/engine.yaml
          IMAGE=$(python3 scripts/build_args.py $Y --get image)
          VERSION=$(python3 scripts/build_args.py $Y --get version)
          mapfile -t ARGS < <(python3 scripts/build_args.py $Y)
          PUSH="${{ github.event_name != 'pull_request' && github.event.inputs.push != 'false' }}"
          OUT=(--load); [ "$PUSH" = true ] && OUT=(--push)
          docker buildx build --platform linux/arm64 -f engines/sglang/Dockerfile "${ARGS[@]}" \
            --cache-from type=gha,scope=sglang --cache-to type=gha,scope=sglang,mode=max \
            -t $IMAGE:$VERSION -t $IMAGE:$VERSION-${{ github.sha }} -t $IMAGE:latest \
            --metadata-file /tmp/meta.json "${OUT[@]}" engines/sglang
          if [ "$PUSH" = true ]; then
            mkdir -p digests
            python3 -c "import json; d=json.load(open('/tmp/meta.json'))['containerimage.digest']; json.dump({'$IMAGE:$VERSION': d}, open('digests/sglang.json','w'))"
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('digests/sglang.json') != ''
        with:
          name: digest-sglang
          path: digests/

name: build-sglang
#
# Published for every platform in each variant's `engine.yaml`: each is built
# natively on its own runner and pushed by digest, then `merge` makes one
# index under that variant's version tags, refusing a partial image.

on:
  push:
    branches: [main]
    paths:
      - "engines/sglang/**"
      - "engines/sglang-inkling-2-mini/**"
      - ".github/workflows/build-sglang.yml"
      - "scripts/build_args.py"
  # A PR that changes the build builds every platform without pushing.
  pull_request:
    paths:
      - "engines/sglang/**"
      - "engines/sglang-inkling-2-mini/**"
      - ".github/workflows/build-sglang.yml"
      - "scripts/build_args.py"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      variants:
        description: "Space-separated engine dirs to build"
        default: "engines/sglang engines/sglang-inkling-2-mini"
      push:
        description: "Push to ghcr.io"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      variants: ${{ steps.m.outputs.variants }}
      push: ${{ steps.m.outputs.push }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: m
        env:
          PUSH: ${{ github.event_name != 'pull_request' && github.event.inputs.push != 'false' }}
          WANT: ${{ github.event.inputs.variants }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          runners = {"linux/arm64": "ubuntu-24.04-arm", "linux/amd64": "ubuntu-latest"}
          all_variants = ["engines/sglang", "engines/sglang-inkling-2-mini"]
          wanted = os.environ.get("WANT", "").split() or all_variants
          items, variants = [], []
          for directory in all_variants:
              if directory not in wanted:
                  continue
              name = directory.rsplit("/", 1)[-1]
              variants.append({"dir": directory, "name": name})
              platforms = subprocess.check_output(
                  ["python3", "scripts/build_args.py", f"{directory}/engine.yaml", "--get", "platforms"], text=True
              ).split()
              items.extend({"dir": directory, "name": name, "platform": p,
                            "slug": p.replace("/", "-"), "runner": runners[p]} for p in platforms)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": items}) + "\n")
              fh.write("variants=" + json.dumps({"include": variants}) + "\n")
              fh.write("push=" + os.environ["PUSH"] + "\n")
          print(json.dumps(items, indent=2))
          PY

  image:
    needs: plan
    name: ${{ matrix.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/login-action@v3
        if: needs.plan.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and push by digest
        run: |
          set -eu
          Y=${{ matrix.dir }}/engine.yaml
          IMAGE=$(python3 scripts/build_args.py $Y --get image)
          CONTEXT=$(python3 scripts/build_args.py $Y --get context)
          DOCKERFILE=$(python3 scripts/build_args.py $Y --get dockerfile)
          mapfile -t ARGS < <(python3 scripts/build_args.py $Y --platform ${{ matrix.platform }})
          if [ "${{ needs.plan.outputs.push }}" = true ]; then
            OUT=(--output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true")
          else
            OUT=(--output type=cacheonly)
          fi
          docker buildx build --platform ${{ matrix.platform }} -f "$DOCKERFILE" "${ARGS[@]}" \
            --cache-from type=gha,scope=${{ matrix.name }}-${{ matrix.slug }} \
            --cache-to type=gha,scope=${{ matrix.name }}-${{ matrix.slug }},mode=max \
            --metadata-file /tmp/meta.json "${OUT[@]}" "$CONTEXT"
          if [ "${{ needs.plan.outputs.push }}" = true ]; then
            mkdir -p /tmp/digests
            python3 -c "import json; print(json.load(open('/tmp/meta.json'))['containerimage.digest'])" > /tmp/digests/${{ matrix.slug }}
            cat /tmp/digests/${{ matrix.slug }}
          fi
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.push == 'true'
        with:
          name: platform-digest-${{ matrix.name }}-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [plan, image]
    if: needs.plan.outputs.push == 'true'
    name: ${{ matrix.name }} (index)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-digest-${{ matrix.name }}-linux-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-platform index
        run: |
          set -eu
          Y=${{ matrix.dir }}/engine.yaml
          IMAGE=$(python3 scripts/build_args.py $Y --get image)
          VERSION=$(python3 scripts/build_args.py $Y --get version)
          WANT=$(python3 scripts/build_args.py $Y --get platforms | wc -l)
          GOT=$(find /tmp/digests -type f | wc -l)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::$IMAGE has $GOT of $WANT platform digests; not publishing a partial index"
            exit 1
          fi
          SOURCES=$(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools create \
            -t $IMAGE:$VERSION -t $IMAGE:$VERSION-${{ github.sha }} -t $IMAGE:latest \
            $SOURCES
          docker buildx imagetools inspect $IMAGE:$VERSION
          DIGEST=$(docker buildx imagetools inspect $IMAGE:$VERSION --format '{{json .Manifest}}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          mkdir -p digests
          python3 -c "import json; json.dump({'$IMAGE:$VERSION': '$DIGEST'}, open('digests/${{ matrix.name }}.json','w'))"
          cat digests/${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/

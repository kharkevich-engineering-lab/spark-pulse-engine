name: build-tensorfold

# TensorFold is the cheapest image here to build: nothing is compiled. The
# Dockerfile fetches the pinned release archive, checks its sha256, and adds
# the NCCL and verbs libraries the archive leaves to the host. Minutes, not
# hours, so one job and a short timeout.

on:
  push:
    branches: [main]
    paths:
      - "engines/tensorfold/**"
      - ".github/workflows/build-tensorfold.yml"
      - "scripts/build_args.py"
  # A PR that changes the build builds it without pushing.
  pull_request:
    paths:
      - "engines/tensorfold/**"
      - ".github/workflows/build-tensorfold.yml"
      - "scripts/build_args.py"
  workflow_dispatch:
    inputs:
      push:
        description: "Push to ghcr.io"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        run: |
          set -eu
          Y=engines/tensorfold/engine.yaml
          IMAGE=$(python3 scripts/build_args.py $Y --get image)
          VERSION=$(python3 scripts/build_args.py $Y --get version)
          NAME=$(python3 scripts/build_args.py $Y --get name)
          CONTEXT=$(python3 scripts/build_args.py $Y --get context)
          DOCKERFILE=$(python3 scripts/build_args.py $Y --get dockerfile)
          mapfile -t ARGS < <(python3 scripts/build_args.py $Y)
          PUSH="${{ github.event_name != 'pull_request' && github.event.inputs.push != 'false' }}"
          OUT=(--load); [ "$PUSH" = true ] && OUT=(--push)
          docker buildx build --platform linux/arm64 -f "$DOCKERFILE" "${ARGS[@]}" \
            --cache-from type=gha,scope=$NAME --cache-to type=gha,scope=$NAME,mode=max \
            -t $IMAGE:$VERSION -t $IMAGE:$VERSION-${{ github.sha }} -t $IMAGE:latest \
            --metadata-file /tmp/meta.json "${OUT[@]}" "$CONTEXT"
          if [ "$PUSH" = true ]; then
            mkdir -p digests
            python3 -c "import json; d=json.load(open('/tmp/meta.json'))['containerimage.digest']; json.dump({'$IMAGE:$VERSION': d}, open('digests/$NAME.json','w'))"
            cat digests/$NAME.json
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.name != '' && hashFiles(format('digests/{0}.json', steps.build.outputs.name)) != ''
        with:
          name: digest-${{ steps.build.outputs.name }}
          path: digests/

name: build-vllm-variant

# One vLLM variant, built as its own three-job chain: flashinfer wheels, vllm
# wheel, runner image.
#
# It is a reusable workflow rather than three matrix jobs because `needs` is
# evaluated per *job*, not per matrix entry: one variant's wheel job failing
# skipped the wheel and image jobs for every other variant too, even ones whose
# own wheels had built. `fail-fast: false` does not help — it stops siblings
# being cancelled, it does not make a downstream job run. Calling this workflow
# once per variant gives each one an independent graph.

on:
  workflow_call:
    inputs:
      dir:        {type: string, required: true}
      name:       {type: string, required: true}
      image:      {type: string, required: true}
      version:    {type: string, required: true}
      context:    {type: string, required: true}
      dockerfile: {type: string, required: true}
      mode:       {type: string, required: true}
      fi_key:     {type: string, required: true}
      vllm_key:   {type: string, required: true}
      push:       {type: boolean, required: true}
      # Space-separated `arch` entries from engine.yaml. linux/arm64 is the
      # Spark image built from the wheels below; linux/amd64 is upstream's
      # x86_64 wheel (Dockerfile, runner-upstream) and needs none of them.
      platforms:  {type: string, required: false, default: "linux/arm64"}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  flashinfer-wheels:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v4
        with:
          path: wheels/${{ inputs.name }}/flashinfer
          key: ${{ inputs.fi_key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install pyyaml
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'prebuilt'
        name: Download prebuilt FlashInfer wheels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch_wheels.py ${{ inputs.dir }}/engine.yaml --out /tmp/w
          mkdir -p wheels/${{ inputs.name }} && mv /tmp/w/flashinfer wheels/${{ inputs.name }}/flashinfer
          ls -la wheels/${{ inputs.name }}/flashinfer
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'source'
        uses: ./.github/actions/free-disk
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'source'
        uses: docker/setup-buildx-action@v3
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'source'
        name: Build FlashInfer wheels
        run: |
          set -eu
          mapfile -t ARGS < <(python3 scripts/build_args.py ${{ inputs.dir }}/engine.yaml)
          docker buildx build --platform linux/arm64 -f ${{ inputs.dockerfile }} "${ARGS[@]}" \
            --build-arg BUILD_JOBS=$(nproc) \
            --cache-from type=gha,scope=vllm-base --cache-to type=gha,scope=vllm-base,mode=max \
            --target flashinfer-export --output type=local,dest=wheels/${{ inputs.name }}/flashinfer ${{ inputs.context }}
          ls -la wheels/${{ inputs.name }}/flashinfer

  vllm-wheels:
    needs: [flashinfer-wheels]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v4
        with:
          path: wheels/${{ inputs.name }}/vllm
          key: ${{ inputs.vllm_key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install pyyaml
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'prebuilt'
        name: Download prebuilt vLLM wheel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch_wheels.py ${{ inputs.dir }}/engine.yaml --out /tmp/w
          mkdir -p wheels/${{ inputs.name }} && mv /tmp/w/vllm wheels/${{ inputs.name }}/vllm
          ls -la wheels/${{ inputs.name }}/vllm
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'source'
        uses: ./.github/actions/free-disk
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'source'
        uses: docker/setup-buildx-action@v3
      - if: steps.cache.outputs.cache-hit != 'true' && inputs.mode == 'source'
        name: Build vLLM wheel
        run: |
          set -eu
          mapfile -t ARGS < <(python3 scripts/build_args.py ${{ inputs.dir }}/engine.yaml)
          docker buildx build --platform linux/arm64 -f ${{ inputs.dockerfile }} "${ARGS[@]}" \
            --build-arg BUILD_JOBS=$(nproc) \
            --cache-from type=gha,scope=vllm-base \
            --target vllm-export --output type=local,dest=wheels/${{ inputs.name }}/vllm ${{ inputs.context }}
          ls -la wheels/${{ inputs.name }}/vllm

  image:
    needs: [flashinfer-wheels, vllm-wheels]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v4
        with:
          path: wheels/${{ inputs.name }}/flashinfer
          key: ${{ inputs.fi_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: wheels/${{ inputs.name }}/vllm
          key: ${{ inputs.vllm_key }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the arm64 runner, and push it by digest
        run: |
          set -eu
          mapfile -t ARGS < <(python3 scripts/build_args.py ${{ inputs.dir }}/engine.yaml --platform linux/arm64)
          # No tag here: the merge job tags the multi-platform index, so a
          # single platform is never what `:<version>` resolves to.
          if [ "${{ inputs.push }}" = true ]; then
            OUT=(--output "type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true")
          else
            OUT=(--output type=cacheonly)
          fi
          docker buildx build --platform linux/arm64 -f ${{ inputs.dockerfile }} "${ARGS[@]}" \
            --build-arg BUILD_JOBS=$(nproc) \
            --build-context flashinfer_wheels=wheels/${{ inputs.name }}/flashinfer \
            --build-context vllm_wheels=wheels/${{ inputs.name }}/vllm \
            --cache-from type=gha,scope=vllm-base \
            --cache-from type=gha,scope=${{ inputs.name }}-runner --cache-to type=gha,scope=${{ inputs.name }}-runner,mode=max \
            --target runner \
            --metadata-file /tmp/meta.json "${OUT[@]}" ${{ inputs.context }}
          if [ "${{ inputs.push }}" = true ]; then
            mkdir -p /tmp/digests
            python3 -c 'import json; print(json.load(open("/tmp/meta.json"))["containerimage.digest"])' > /tmp/digests/linux-arm64
            cat /tmp/digests/linux-arm64
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.push
        with:
          name: platform-digest-${{ inputs.name }}-linux-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The amd64 half: upstream's x86_64 wheel for the same commit, installed on a
  # native x86 runner. It needs none of the wheels above.
  image-amd64:
    if: contains(inputs.platforms, 'linux/amd64')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the amd64 runner, and push it by digest
        run: |
          set -eu
          mapfile -t ARGS < <(python3 scripts/build_args.py ${{ inputs.dir }}/engine.yaml --platform linux/amd64)
          if [ "${{ inputs.push }}" = true ]; then
            OUT=(--output "type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true")
          else
            OUT=(--output type=cacheonly)
          fi
          docker buildx build --platform linux/amd64 -f ${{ inputs.dockerfile }} "${ARGS[@]}" \
            --cache-from type=gha,scope=${{ inputs.name }}-runner-amd64 \
            --cache-to type=gha,scope=${{ inputs.name }}-runner-amd64,mode=max \
            --target runner \
            --metadata-file /tmp/meta.json "${OUT[@]}" ${{ inputs.context }}
          if [ "${{ inputs.push }}" = true ]; then
            mkdir -p /tmp/digests
            python3 -c 'import json; print(json.load(open("/tmp/meta.json"))["containerimage.digest"])' > /tmp/digests/linux-amd64
            cat /tmp/digests/linux-amd64
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.push
        with:
          name: platform-digest-${{ inputs.name }}-linux-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One index over every platform the variant declares. It refuses a partial
  # index: a platform whose build failed would otherwise tell that platform's
  # nodes the image does not exist for them.
  merge:
    needs: [image, image-amd64]
    if: always() && inputs.push && needs.image.result == 'success' && (needs.image-amd64.result == 'success' || needs.image-amd64.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-digest-${{ inputs.name }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-platform index
        id: index
        run: |
          set -eu
          IMAGE=${{ inputs.image }}
          VERSION=${{ inputs.version }}
          WANT=$(echo "${{ inputs.platforms }}" | wc -w)
          GOT=$(ls /tmp/digests | wc -l)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::$IMAGE has $GOT of $WANT platform digests; not publishing a partial index"
            exit 1
          fi
          SOURCES=$(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools create \
            -t $IMAGE:$VERSION -t $IMAGE:$VERSION-${{ github.sha }} -t $IMAGE:latest \
            $SOURCES
          docker buildx imagetools inspect $IMAGE:$VERSION
          DIGEST=$(docker buildx imagetools inspect $IMAGE:$VERSION --format '{{json .Manifest}}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Record digest
        run: |
          mkdir -p digests
          echo '{"${{ inputs.image }}:${{ inputs.version }}": "${{ steps.index.outputs.digest }}"}' > digests/${{ inputs.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ inputs.name }}
          path: digests/

name: build-vllm

# vLLM images on GitHub's native arm64 runners, split into three jobs:
#   flashinfer-wheels -> vllm-wheels -> image
# `wheels.mode` in engine.yaml picks how the wheel jobs get their wheels:
#   prebuilt  download the *.whl assets of the named GitHub releases (minutes)
#   source    compile from the pinned refs inside the Dockerfile (hours)
# Wheels are cached: prebuilt by release asset digests, source by pinned refs
# plus a hash of the Dockerfile and patch queue.

on:
  push:
    branches: [main]
    paths:
      - "engines/vllm/**"
      - "engines/vllm-b12x/**"
      - ".github/workflows/build-vllm.yml"
      - "scripts/build_args.py"
      - "scripts/fetch_wheels.py"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      variants:
        description: "Space-separated engine dirs to build"
        default: "engines/vllm"
      push:
        description: "Push to ghcr.io"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANTS: ${{ github.event.inputs.variants || 'engines/vllm' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, pathlib, subprocess, yaml
          items = []
          for d in os.environ["VARIANTS"].split():
              y = f"{d}/engine.yaml"
              get = lambda k: subprocess.check_output(["python3", "scripts/build_args.py", y, "--get", k], text=True).strip()
              args = json.loads(subprocess.check_output(["python3", "scripts/build_args.py", y, "--json"], text=True))
              h = hashlib.sha256()
              for p in sorted(pathlib.Path("engines/vllm").rglob("*")):
                  if p.is_file():
                      h.update(p.read_bytes())
              mode = (yaml.safe_load(open(y)).get("wheels") or {}).get("mode", "source")
              name = get("name")
              if mode == "prebuilt":
                  keys = dict(l.split("=", 1) for l in subprocess.check_output(["python3", "scripts/fetch_wheels.py", y, "--keys"], text=True).split())
                  fi_key, vllm_key = f"{name}-{keys['flashinfer']}", f"{name}-{keys['vllm']}"
              else:
                  fi_key = f"fi-{args['FLASHINFER_REF']}-{args['TORCH_VERSION']}-{h.hexdigest()[:12]}"
                  vllm_key = f"vllm-{args['VLLM_REF']}-{args['FLASHINFER_REF']}-{args['TORCH_VERSION']}-{h.hexdigest()[:12]}"
              items.append({
                  "dir": d, "name": name, "image": get("image"), "version": get("version"),
                  "context": get("context"), "dockerfile": get("dockerfile"), "mode": mode,
                  "fi_key": fi_key, "vllm_key": vllm_key,
              })
          print("matrix=" + json.dumps({"include": items}))
          EOF

  flashinfer-wheels:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v4
        with:
          path: wheels/${{ matrix.name }}/flashinfer
          key: ${{ matrix.fi_key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install pyyaml
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'prebuilt'
        name: Download prebuilt FlashInfer wheels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch_wheels.py ${{ matrix.dir }}/engine.yaml --out /tmp/w
          mkdir -p wheels/${{ matrix.name }} && mv /tmp/w/flashinfer wheels/${{ matrix.name }}/flashinfer
          ls -la wheels/${{ matrix.name }}/flashinfer
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'source'
        uses: ./.github/actions/free-disk
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'source'
        uses: docker/setup-buildx-action@v3
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'source'
        name: Build FlashInfer wheels
        run: |
          set -eu
          mapfile -t ARGS < <(python3 scripts/build_args.py ${{ matrix.dir }}/engine.yaml)
          docker buildx build --platform linux/arm64 -f ${{ matrix.dockerfile }} "${ARGS[@]}" \
            --build-arg BUILD_JOBS=$(nproc) \
            --cache-from type=gha,scope=vllm-base --cache-to type=gha,scope=vllm-base,mode=max \
            --target flashinfer-export --output type=local,dest=wheels/${{ matrix.name }}/flashinfer ${{ matrix.context }}
          ls -la wheels/${{ matrix.name }}/flashinfer

  vllm-wheels:
    needs: [plan, flashinfer-wheels]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v4
        with:
          path: wheels/${{ matrix.name }}/vllm
          key: ${{ matrix.vllm_key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install pyyaml
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'prebuilt'
        name: Download prebuilt vLLM wheel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch_wheels.py ${{ matrix.dir }}/engine.yaml --out /tmp/w
          mkdir -p wheels/${{ matrix.name }} && mv /tmp/w/vllm wheels/${{ matrix.name }}/vllm
          ls -la wheels/${{ matrix.name }}/vllm
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'source'
        uses: ./.github/actions/free-disk
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'source'
        uses: docker/setup-buildx-action@v3
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.mode == 'source'
        name: Build vLLM wheel
        run: |
          set -eu
          mapfile -t ARGS < <(python3 scripts/build_args.py ${{ matrix.dir }}/engine.yaml)
          docker buildx build --platform linux/arm64 -f ${{ matrix.dockerfile }} "${ARGS[@]}" \
            --build-arg BUILD_JOBS=$(nproc) \
            --cache-from type=gha,scope=vllm-base \
            --target vllm-export --output type=local,dest=wheels/${{ matrix.name }}/vllm ${{ matrix.context }}
          ls -la wheels/${{ matrix.name }}/vllm

  image:
    needs: [plan, flashinfer-wheels, vllm-wheels]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v4
        with:
          path: wheels/${{ matrix.name }}/flashinfer
          key: ${{ matrix.fi_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: wheels/${{ matrix.name }}/vllm
          key: ${{ matrix.vllm_key }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runner image
        id: build
        run: |
          set -eu
          mapfile -t ARGS < <(python3 scripts/build_args.py ${{ matrix.dir }}/engine.yaml)
          PUSH="${{ github.event_name != 'pull_request' && github.event.inputs.push != 'false' }}"
          OUT=(--load); [ "$PUSH" = true ] && OUT=(--push)
          docker buildx build --platform linux/arm64 -f ${{ matrix.dockerfile }} "${ARGS[@]}" \
            --build-arg BUILD_JOBS=$(nproc) \
            --build-context flashinfer_wheels=wheels/${{ matrix.name }}/flashinfer \
            --build-context vllm_wheels=wheels/${{ matrix.name }}/vllm \
            --cache-from type=gha,scope=vllm-base \
            --cache-from type=gha,scope=${{ matrix.name }}-runner --cache-to type=gha,scope=${{ matrix.name }}-runner,mode=max \
            --target runner \
            -t ${{ matrix.image }}:${{ matrix.version }} \
            -t ${{ matrix.image }}:${{ matrix.version }}-${{ github.sha }} \
            -t ${{ matrix.image }}:latest \
            --metadata-file /tmp/meta.json "${OUT[@]}" ${{ matrix.context }}
          if [ "$PUSH" = true ]; then
            echo "digest=$(python3 -c 'import json; print(json.load(open("/tmp/meta.json"))["containerimage.digest"])')" >> "$GITHUB_OUTPUT"
          fi
      - name: Record digest
        if: steps.build.outputs.digest != ''
        run: |
          mkdir -p digests
          echo '{"${{ matrix.image }}:${{ matrix.version }}": "${{ steps.build.outputs.digest }}"}' > digests/${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.digest != ''
        with:
          name: digest-${{ matrix.name }}
          path: digests/

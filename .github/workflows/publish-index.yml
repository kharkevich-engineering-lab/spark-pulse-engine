name: publish-index

# Regenerates index.yaml and publishes it as an OCI artifact at
#   ghcr.io/<owner>/spark-pulse-engine/index:latest  (and :<sha>)
# Spark Pulse configures that reference as an engine index source.
# Runs after every successful build workflow so digests are current, and on
# demand.

on:
  workflow_run:
    workflows: [build-vllm, build-sglang]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # The registry is the authority on what is published, and unlike a build
      # run's artifacts it never goes stale. Collecting digests from the latest
      # run of each build workflow lost every engine that run did not build, so
      # publishing one variant marked the others unpublished.
      - name: Resolve published digests from the registry
        run: python3 scripts/resolve_digests.py --out digests.json && cat digests.json
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate index.yaml
        run: python3 scripts/inventory.py --digests digests.json && cat index.yaml
      - uses: oras-project/setup-oras@v1
      - name: Push index as OCI artifact
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          REF=ghcr.io/${{ github.repository }}/index
          oras push "$REF:latest,${{ github.sha }}" \
            --artifact-type application/vnd.spark-pulse.engine-index.v1+yaml \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            index.yaml:application/vnd.spark-pulse.engine-index.v1+yaml
      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: index.yaml

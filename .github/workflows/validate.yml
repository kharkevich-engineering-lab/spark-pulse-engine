name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate engine metadata
        run: python3 scripts/validate.py --strict
      - name: Build index
        run: python3 scripts/inventory.py --out /tmp/index.yaml && head -40 /tmp/index.yaml
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3006,DL3008,DL3013,DL3042,DL4006,SC2086,DL3003

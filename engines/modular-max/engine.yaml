schema_version: "1"
engine: modular-max
variant: default
description: Modular MAX, the OpenAI-compatible `max serve`, from Modular's own multi-arch image.
# Modular builds it; `build.external` below.
image: docker.io/modular/max-nvidia-full
tag: 26.5.0
version: 0.1.0
arch: [linux/arm64]
gpu_arch: ["12.1a"]
build: {external: true}

sources:
  max:
    image: docker.io/modular/max-nvidia-full@sha256:58d6d31d7e43516d4503959cf2d1e3b77f84d657789056204276d141307d52e7

runtime:
  workdir: /workspace
  # `--no-device-graph-capture` is not a preference: without it MAX dies on a
  # GB10 during warmup, in `warmup_graph_capture` -> `vmmCreate failed: CUDA
  # call failed: CUDA_ERROR_INVALID_DEVICE (invalid device ordinal)`. The
  # unified-memory virtual allocation this hardware uses is what its graph
  # capture cannot do. Measured on a GB10 (driver 580.159.03): with the flag it
  # serves, without it the worker crashes before listening. `--devices gpu:0`
  # was tried alongside and is not needed.
  serve: max serve --no-device-graph-capture
  model_arg: --model
  # MAX answers readiness under /v1, not at the root.
  readiness: /v1/health
  models_endpoint: /v1/models
  metrics: /metrics
  ports: {api: 8000}
  cache_mounts: [~/.cache/huggingface]
  env:
    HF_HOME: /root/.cache/huggingface
  container:
    privileged: false
    ipc_host: true
    network_host: true
    keepalive: sleep infinity
  # MAX has no distributed tensor parallelism at all: it is one process on one
  # host, and spreads across *local* GPUs with --devices. On a Spark, which has
  # one, that means one.
  multi_node:
    style: none
  # No `host`: `max serve` has no such option, and passing one is not a
  # warning but an immediate "No such option '--host'". It binds every
  # interface on its own. Verified against `max serve --help` in 26.5.0 on a
  # GB10, which is also where `--device-memory-utilization` came from --
  # MAX's spelling of the fraction every other engine calls something else.
  param_flags:
    port: --port
    max_model_len: --max-length
    max_num_seqs: --max-batch-size
    gpu_memory_utilization: --device-memory-utilization

capabilities: {mods: false, pr_mods: false, solo: true, cluster: false, mesh: false}
verified:
  - {nodes: 1, tp: 1, model: Qwen/Qwen2.5-0.5B-Instruct, date: "2026-09-07",
     notes: "scripts/smoke-test.sh on GB10 (driver 580.159.03), image 26.5.0
     digest 58d6d31d; /v1/health ready, /v1/models named the model,
     chat completion returned. Needs --no-device-graph-capture: without it the
     model worker crashes in warmup_graph_capture with
     CUDA_ERROR_INVALID_DEVICE. Note max serve has no --host flag at all."}

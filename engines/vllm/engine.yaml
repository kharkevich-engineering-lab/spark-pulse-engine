schema_version: "1"
engine: vllm
variant: default
description: >-
  vLLM for DGX Spark (GB10, sm_121, CUDA 13) with the Spark patch queue, and,
  in the same multi-platform image, upstream's x86_64 cu130 build of the same
  commit for an x86 host with an NVIDIA GPU.
image: ghcr.io/kharkevich-engineering-lab/spark-pulse-engine/vllm
version: 0.3.0
legacy_tags: [vllm-node]
# One multi-platform image. arm64 is the Spark build below (these wheels, our
# NCCL, the patch queue, sm_121); amd64 is upstream's x86_64 wheel for the
# same vLLM commit, unpatched (Dockerfile, runner-upstream).
arch: [linux/arm64, linux/amd64]
gpu_arch: ["12.1a", "8.0", "8.6", "8.9", "9.0", "12.0"]

sources:
  base: {image: nvidia/cuda:13.0.2-devel-ubuntu24.04}
  # The main commit eugr's prebuilt-vllm-current (0.34.0rc1.dev935+g885cce754,
  # 2026-11-19) was built from: dev932 is fd2b7ac, and the three extra
  # commits are the PRs eugr merges on top. The amd64 half installs
  # upstream's wheel for this same commit.
  vllm: {repo: https://github.com/vllm-project/vllm.git, ref: fd2b7ac40fba94906ad44c84b6a51e77c9fae8a8}
  # v0.7.5, the release eugr's prebuilt-flashinfer-current wheels are.
  flashinfer: {repo: https://github.com/flashinfer-ai/flashinfer.git, ref: 9aa920602276537b27e017a762a71e3437fc7f0d}
  # v2.32.6-1.
  nccl: {repo: https://github.com/NVIDIA/nccl.git, ref: ad2d192c1f279aefcaf340f67e07880b65a1116b}
  deepgemm: {repo: https://github.com/deepseek-ai/DeepGEMM.git, ref: a6b593d2826719dcf4892609af7b84ee23aaf32a}
  # What eugr's wheels are built against (their Dockerfile's TORCH_VERSION
  # and friends); a prebuilt wheel on any other torch fails to import.
  torch: {version: "2.14.0", index: https://download.pytorch.org/whl/cu130}
  torchvision: {version: "0.29.0"}
  torchaudio: {version: "2.11.0"}
  cutlass_dsl: {version: "4.7.0"}

wheels:
  # Upstream publishes daily wheels built from vllm main with the same patch
  # queue and torch pin we carry. Prebuilt keeps CI under an hour; switch to
  # `source` (or run scripts/build.sh --wheels) to build from the pinned refs.
  mode: prebuilt
  flashinfer: {release: eugr/spark-vllm-docker@prebuilt-flashinfer-current}
  vllm: {release: eugr/spark-vllm-docker@prebuilt-vllm-current}

build_args:
  TORCH_CUDA_ARCH_LIST: 12.1a
  VLLM_PRESERVE_SM12X_TARGET: 0

platform_build_args:
  linux/amd64:
    VLLM_RUNNER: upstream
    # vLLM main builds its wheels for CUDA 13.2 now (cu132 is the default
    # variant, and no cu130 wheel is published for a main commit), so the
    # amd64 half takes that wheel, PyTorch's cu132 torch, and a CUDA 13.2
    # base whose nvcc matches it for FlashInfer's and Triton's JIT. The
    # arm64 half stays on cu130, which is what eugr's wheels are.
    VLLM_WHEEL_VARIANT: cu132
    TORCH_INDEX: https://download.pytorch.org/whl/cu132
    BASE_IMAGE: nvidia/cuda:13.2.1-devel-ubuntu24.04
    # What FlashInfer and Triton JIT for at runtime on an x86 host: Ampere,
    # Ada, Hopper, consumer Blackwell. Space-separated, not `;`: the image
    # copies this into FLASHINFER_CUDA_ARCH_LIST, which FlashInfer splits on
    # spaces only (a `;` list fails its import), and torch takes either.
    TORCH_CUDA_ARCH_LIST: "8.0 8.6 8.9 9.0 12.0"

runtime:
  python: "3.12"
  workdir: /workspace/vllm
  site_packages: /usr/local/lib/python3.12/dist-packages
  serve: vllm serve
  model_arg: positional
  readiness: /v1/models
  models_endpoint: /v1/models
  metrics: /metrics
  ports: {api: 8000, rendezvous: 29501}
  cache_mounts: [~/.cache/huggingface, ~/.cache/vllm, ~/.cache/flashinfer, ~/.triton, ~/.tilelang]
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    NCCL_IGNORE_CPU_AFFINITY: "1"
  container:
    privileged: true
    ipc_host: true
    network_host: true
    ulimits: {nofile: "1048576:1048576"}
    keepalive: sleep infinity
  multi_node:
    style: torchrun
  param_flags:
    port: --port
    host: --host
    tensor_parallel: --tensor-parallel-size
    pipeline_parallel: --pipeline-parallel-size
    gpu_memory_utilization: --gpu-memory-utilization
    max_model_len: --max-model-len
    max_num_batched_tokens: --max-num-batched-tokens
    max_num_seqs: --max-num-seqs

capabilities: {mods: true, pr_mods: true, solo: true, cluster: true, mesh: true}
verified:
  - {nodes: 1, tp: 1, model: Qwen/Qwen2.5-0.5B-Instruct, date: "2026-09-03", notes: "scripts/smoke-test.sh on GB10 (driver 580.159.03), image 0.1.0 digest 569f436f, vllm 0.28.1rc1.dev345+g4cc0cb6f7 prebuilt wheel; ready in 170s, chat completion ok"}
